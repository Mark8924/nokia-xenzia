plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'local.snake.xenzia'
    compileSdk 36
    defaultConfig {
        applicationId 'local.snake.xenzia'
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName '1.1.1-preview'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (System.getenv('NOKIA_KEYSTORE')) storeFile file(System.getenv('NOKIA_KEYSTORE'))
            storePassword System.getenv('NOKIA_STORE_PASSWORD')
            keyAlias 'snake-xenzia'
            keyPassword System.getenv('NOKIA_STORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging true } }
}
chaquopy {
    defaultConfig {
        version '3.12'
        buildPython System.getenv('PYTHON312') ?: 'python3.12'
        pip { install 'pillow==11.0.0' }
    }
}
